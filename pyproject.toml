[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-arithmetic"
version = "0.1.0"
description = "A small LangGraph arithmetic agent"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-openai",
    "langgraph",
    "langsmith",
    "mcp>=1.0,<2",
    "python-dotenv",
    "fastapi",
    "scikit-learn",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.setuptools]
py-modules = [
    "agent",
    "chat_agent",
    "legacy_chat_agent",
    "mcp_server",
    "mnist_workflow",
    "tools",
    "web_app",
]
